name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: python experiment.py
      - run: python active_experiment.py
      - run: python gate5_gate6.py
      - run: python gate7_slow_write.py
      - run: python gate8_attack.py
      - run: python gate9_causal_write.py
      - run: python purifier_hotspot_probe.py
      - run: python gate11_ais_receipt.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate11-ais-receipt-py${{ matrix.python-version }}
          path: results/gate11_ais_receipt.json
