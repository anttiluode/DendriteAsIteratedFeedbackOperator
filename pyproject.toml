[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrite-as-iterated-feedback-operator"
version = "0.1.0"
description = "A falsifiable operator bridge between recursive mode selection and compartmental dendrites"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
research = ["scipy>=1.10", "morphio>=3.3"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
